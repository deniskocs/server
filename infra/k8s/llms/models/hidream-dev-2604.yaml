# HiDream-O1-Image-Dev-2604 T2I on RTX Titan (~24 GiB). LOCK: enabled=false, replicas=0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hidream-dev-2604
  namespace: llm-orchestrator
  labels:
    app: hidream-dev-2604
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    llm-orchestrator.chilik.net/enabled: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hidream-dev-2604
  template:
    metadata:
      labels:
        app: hidream-dev-2604
    spec:
      nodeSelector:
        rtx-titan: "true"
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: deniskocs/core:hidream-runner-1.0.2
          imagePullPolicy: Always
          env:
            - name: DEFAULT_MODEL_NAME
              value: "HiDream-ai/HiDream-O1-Image-Dev-2604"
            - name: SERVED_MODEL_NAME
              value: "HiDream-ai/HiDream-O1-Image-Dev-2604"
            - name: HIDREAM_DEFAULT_SIZE
              value: "1024x1024"
            - name: HIDREAM_DEFAULT_SEED
              value: "32"
            - name: HIDREAM_DTYPE
              value: "bfloat16"
            - name: FA_VERSION
              value: "auto"
            # Physical GPU 1 on rtx-titan (GPU 0 often busy). Entrypoint sets CUDA_VISIBLE_DEVICES
            # before torch init; inside the container that GPU is cuda:0.
            - name: HIDREAM_PHYSICAL_GPU
              value: "1"
            - name: HIDREAM_CUDA_DEVICE
              value: "0"
            - name: HIDREAM_GPU_MAX_MEMORY
              value: "22GiB"
            # 0 = native width/height (patch-aligned 32px); 1 = official bucket snap to 2048² etc.
            - name: HIDREAM_SNAP_RESOLUTION
              value: "0"
            # Disable expandable_segments — can fail near full VRAM during shard load.
            - name: PYTORCH_ALLOC_CONF
              value: ""
          ports:
            - name: http
              containerPort: 80
              hostPort: 8031
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hidream-dev-2604
  namespace: llm-orchestrator
  labels:
    app: hidream-dev-2604
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    llm-orchestrator.chilik.net/enabled: "true"
spec:
  type: ClusterIP
  selector:
    app: hidream-dev-2604
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
