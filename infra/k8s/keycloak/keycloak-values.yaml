# bitnami/keycloak — пароли только из Secret keycloak-secrets (ExternalSecret + Bitwarden).
# См. external-secret-keycloak.yaml и README (имена секретов в BSM).

auth:
  adminUser: admin
  existingSecret: keycloak-secrets

httpEnabled: true

# Публичный доступ: keycloak.chilik.net (certificate + ingress в этом каталоге).
# TLS terminate на Traefik; Keycloak — HTTP + proxy headers (chart 25 validation).
proxy: edge
proxyHeaders: xforwarded
production: true
hostname: keycloak.chilik.net

# local-path PVC Postgres привязан к ноде; данные — backup/restore в server/backups/keycloak.
nodeSelector:
  kubernetes.io/hostname: gpu-server-rtx-titan

global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak

# Первый старт на новой ноде (build server image) не укладывается в chart default 768Mi.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

postgresql:
  enabled: true
  auth:
    username: keycloak
    database: keycloak
    existingSecret: keycloak-secrets
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  primary:
    nodeSelector:
      kubernetes.io/hostname: gpu-server-rtx-titan

# Не использовать Helm keycloakConfigCli — Job с bitnami/keycloak-config-cli (образ снят).
keycloakConfigCli:
  enabled: false

commonAnnotations:
  argocd.argoproj.io/sync-wave: "20"
